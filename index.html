<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>CarryOrBuy</title>
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <h1>CarryOrBuy</h1>
  <p>What to carry from India, what to buy after landing, and what to skip.</p>

  <h2>Your move</h2>

  <label for="country">Moving from India to:</label>
  <select id="country">
    <option value="Germany">Germany</option>
    <option value="UK">UK</option>
    <option value="US">US</option>
    <option value="France">France</option>
    <option value="Spain">Spain</option>
    <option value="Italy">Italy</option>
    <option value="Ireland">Ireland</option>
    <option value="Canada">Canada</option>
    <option value="Australia">Australia</option>
    <option value="New Zealand">New Zealand</option>
    <option value="UAE">UAE</option>
    <option value="Russia">Russia</option>
  </select>
  <br><br>

  <label for="baggage">Checked baggage allowance (kg):</label>
  <input type="number" id="baggage" value="46" min="0">
  <br><br>

  <label for="budget">Setup budget (₹):</label>
  <input type="number" id="budget" value="50000" min="0">
  <br><br>

  <button id="checkBtn">Show my list</button>

    <div id="results"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
